<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="src/gui/desktop/styles.css">
</head>
<body>
  <div id="terminal"></div>
  <script>
    var m = new URLSearchParams(location.search).get('mode');
    if (!m) m = localStorage.getItem('portfolio:mode') || 'gui';
    if (new URLSearchParams(location.search).has('mode')) {
      try { localStorage.setItem('portfolio:mode', m); } catch {}
    }
    document.write('<script type="module" src="' + (m === 'cli' ? 'src/terminal.js' : 'src/gui/main.js') + '"><\/script>');
  </script>
</body>
</html>
